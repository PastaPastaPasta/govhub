name: deploy-lint

# Static checks for deploy/: every compose combination must render, the RPC and ZMQ ports must
# never be published, the scripts must pass shellcheck and the Caddyfiles must validate. Every tunnel gateway must write
# no logs (no access log, Caddy's default logger discarded), and run from such a Caddyfile. The public TLS proxy must also have
# no access log and a discarded default logger; the only other logger it may have writes certificate-management namespaces.
# The live regtest smoke test (deploy/scripts/smoke-regtest.sh) is not run here yet: it needs the
# bridge image from services/bridge/Dockerfile.

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-lint.yml"
  push:
    branches: [main, master, phase1]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-lint.yml"

permissions:
  contents: read

jobs:
  compose-config:
    name: compose config (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: ${{ matrix.compose_file }}
      COMPOSE_PROFILES: ${{ matrix.profiles }}
      DASHD_P2P_PORT: ${{ matrix.p2p_port }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mainnet
            compose_file: docker-compose.yml
          - name: testnet
            compose_file: docker-compose.yml:docker-compose.testnet.yml
          - name: regtest
            compose_file: docker-compose.yml:docker-compose.regtest.yml
          - name: mainnet + proxy profile
            compose_file: docker-compose.yml
            profiles: proxy
          - name: mainnet + tunnel profile
            compose_file: docker-compose.yml
            profiles: tunnel
          - name: mainnet + tunnel and relay profiles
            compose_file: docker-compose.yml
            profiles: tunnel,relay
          - name: testnet + relay profile, relay as a tunnel guest
            compose_file: docker-compose.yml:docker-compose.testnet.yml:docker-compose.tunnel-guest.yml:docker-compose.relay-tunnel-guest.yml
            profiles: relay
          - name: testnet + issuer + tunnel profiles
            compose_file: docker-compose.yml:docker-compose.testnet.yml
            profiles: issuer,tunnel
          - name: testnet + issuer and relay as tunnel guests
            compose_file: docker-compose.yml:docker-compose.testnet.yml:docker-compose.tunnel-guest.yml:docker-compose.relay-tunnel-guest.yml:docker-compose.issuer-tunnel-guest.yml
            profiles: issuer,relay
          - name: testnet + p2p + proxy profile
            compose_file: docker-compose.yml:docker-compose.testnet.yml:docker-compose.p2p.yml
            profiles: proxy
            p2p_port: "19999"
          - name: testnet + tunnel guest
            compose_file: docker-compose.yml:docker-compose.testnet.yml:docker-compose.tunnel-guest.yml
          - name: mainnet + tunnel profile + tunnel host
            compose_file: docker-compose.yml:docker-compose.tunnel-host.yml
            profiles: tunnel
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose version
        run: docker compose version

      - name: docker compose config
        working-directory: deploy
        run: docker compose config --quiet

      - name: RPC (9998) and ZMQ (29998) must not be published to the host
        working-directory: deploy
        run: |
          set -euo pipefail
          published="$(docker compose config --format json | jq -r '
            .services[] | (.ports // [])[] | "\(.target) \(.published // "")"')"
          echo "published ports (target published):"
          echo "${published:-<none>}"
          if echo "$published" | grep -E '^(9998|29998) |^[0-9]+ (9998|29998)$'; then
            echo "::error::RPC or ZMQ port is published to the host"
            exit 1
          fi

      - name: dashd only on `default`; public-facing services never on `default`; only `tunnel-gateway` on `tunnel`
        working-directory: deploy
        run: |
          set -euo pipefail
          # `tunnel` is shared with another stack's cloudflared (README 11.3): any guest service there other than the gateway
          # (a service named `bridge`, say) would shadow that stack's own `http://bridge:8787` route, or expose something unintended.
          docker compose config --format json | jq -e '
            .services as $s
            | .networks as $n
            | ($s.dashd.networks | keys) == ["default"]
            and ([$s.cloudflared, $s.caddy, $s["tunnel-gateway"]] | map(select(. != null) | .networks | has("default") | not) | all)
            and (if $n.tunnel then ([$s | to_entries[] | select((.value.networks // {}) | has("tunnel")) | .key] == ["tunnel-gateway"]) else true end)' > /dev/null \
            || { echo "::error::network isolation violated"; docker compose config --format json | jq '.services | map_values(.networks)'; exit 1; }

      - name: the tunnel gateway runs from a no-logs Caddyfile (never `caddy reverse-proxy`, whose default logger cannot be discarded)
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose config --format json | jq -e '
            .services["tunnel-gateway"] as $g
            | if $g == null then true
              else ($g.command | join(" ")) == "caddy run --adapter caddyfile --config /etc/caddy/Caddyfile"
                and ([$g.volumes[] | select(.target == "/etc/caddy/Caddyfile") | .source | test("/caddy/tunnel-gateway-[a-z]+\\.Caddyfile$")] == [true])
              end' > /dev/null \
            || { echo "::error::tunnel-gateway must run caddy/tunnel-gateway-*.Caddyfile"; docker compose config --format json | jq '.services["tunnel-gateway"] | {command, volumes}'; exit 1; }

  scripts:
    name: shellcheck and Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x deploy/scripts/*.sh deploy/dashd/entrypoint.sh

      - name: sh -n on the container entrypoint (POSIX sh, not bash)
        run: sh -n deploy/dashd/entrypoint.sh

      - name: Caddyfile validates
        run: |
          docker run --rm \
            -e DOMAIN=gov.example.org -e CORS_ALLOW_ORIGIN='*' \
            -v "$GITHUB_WORKSPACE/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: the public proxy Caddyfile writes no access log and discards the default logger (certificate loggers only besides)
        run: |
          set -euo pipefail
          f=deploy/caddy/Caddyfile
          # Besides the discarded default logger, only loggers limited (`include`) to these certificate-management namespaces may
          # exist, so ACME failures stay visible. Never `tls.handshake` or an http.* request logger: they carry client addresses.
          docker run --rm -e DOMAIN=gov.example.org -e CORS_ALLOW_ORIGIN='*' -v "$GITHUB_WORKSPACE/$f:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
            | jq -e '
                ["tls.obtain", "tls.renew", "tls.issuance.acme", "tls.issuance.zerossl", "tls.cache.maintenance", "http.acme_client"] as $allowed
                | .logging.logs.default.writer.output == "discard"
                and ([.apps.http.servers[] | has("logs")] | any | not)
                and ([.logging.logs | to_entries[] | select(.key != "default") | .value
                      | ((.include // []) | length > 0 and all(. as $n | $allowed | index($n) != null))] | all)' > /dev/null \
            || { echo "::error file=$f::$f must discard Caddy's default logger (log default { output discard }), have no access log, and log only certificate-management namespaces elsewhere"; exit 1; }

      - name: every tunnel-gateway Caddyfile validates and writes no logs
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(deploy/caddy/tunnel-gateway-*.Caddyfile)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no tunnel-gateway Caddyfiles found"; exit 1; }
          for f in "${files[@]}"; do
            echo "== $f"
            docker run --rm -v "$GITHUB_WORKSPACE/$f:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            # the adapted JSON: exactly one logger, `default`, writing to discard; no server has access logs
            docker run --rm -v "$GITHUB_WORKSPACE/$f:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
              | jq -e '
                  (.logging.logs | keys) == ["default"]
                  and .logging.logs.default.writer.output == "discard"
                  and ([.apps.http.servers[] | has("logs")] | any | not)' > /dev/null \
              || { echo "::error file=$f::$f must discard Caddy's default logger (log default { output discard }) and have no access log"; exit 1; }
          done
