name: pages
on:
  push:
    branches: [main]
  # the build writes an entry page per proposal and name contest (scripts/prerender.mjs): rebuilt so new ones get theirs
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base_path is "" once the custom domain (gov.dashhq.org) is set, "/govhub" before it: the build follows whichever is live.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build web app
        run: npm run build -w @govhub/web
        env:
          GOVHUB_BASE: ${{ steps.pages.outputs.base_path }}/
          GOVHUB_SITE_URL: ${{ steps.pages.outputs.origin }}
      # The build writes an entry page per route (title, description, share tags; HTTP 200), plus 404.html: GitHub Pages
      # serves it for any other path, so a proposal or contest newer than the build still loads the app (with HTTP 404).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
