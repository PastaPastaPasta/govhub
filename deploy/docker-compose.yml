# govhub backend stack: dashd + bridge (+ optional cloudflared tunnel or caddy proxy).
#
# This base file is MAINNET. Pick another network by layering an override file, normally through
# COMPOSE_FILE in .env (scripts/init.sh --network <net> writes it for you):
#
#   mainnet : docker-compose.yml
#   testnet : docker-compose.yml:docker-compose.testnet.yml
#   regtest : docker-compose.yml:docker-compose.regtest.yml        (CI and smoke tests)
#   + P2P   : ...:docker-compose.p2p.yml                           (publish the P2P port)
#   + tunnel: COMPOSE_PROFILES=tunnel                              (cloudflared, no open ports)
#   + proxy : COMPOSE_PROFILES=proxy                               (caddy, TLS on a domain)
#
# Needs Docker Compose >= 2.24 (the regtest override uses `!override`).
# Operator guide: README.md. Every variable: .env.example.

name: govhub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------------------------
  # Dash Core. RPC (9998) and ZMQ (29998) are reachable on the compose network only: nothing under
  # `ports:` for them, ever. rpcallowip is limited to GOVHUB_SUBNET.
  # ---------------------------------------------------------------------------------------------
  dashd:
    # Mainnet needs >= v23.1. Every network defaults to the v24 release candidate, which the live
    # deploys run: v24 is what serves quorum proofs (getquorumproofchain, the bridge's /v1/quorum-proof).
    # This default moves to the final v24.0.0 when it is released. Override the tag with DASHD_TAG in .env.
    image: dashpay/dashd:${DASHD_TAG:-24.0.0-rc.4}
    restart: unless-stopped
    logging: *default-logging
    # Give dashd time to flush chainstate; an unclean stop can force a long replay on mainnet.
    stop_grace_period: 3m
    entrypoint: ["/bin/sh", "/opt/govhub/dashd-entrypoint.sh"]
    environment:
      DASH_NETWORK: mainnet
      CORE_RPC_USER: ${CORE_RPC_USER:-govhub}
      RPC_ALLOW_CIDR: ${GOVHUB_SUBNET:-172.29.73.0/24}
      DASHD_DBCACHE_MB: ${DASHD_DBCACHE_MB:-1024}
      DASHD_MAXCONNECTIONS: ${DASHD_MAXCONNECTIONS:-}
      DASHD_P2P_PORT: ${DASHD_P2P_PORT:-}
      DASHD_EXTERNALIP: ${DASHD_EXTERNALIP:-}
      DASHD_EXTRA_ARGS: ${DASHD_EXTRA_ARGS:-}
    secrets:
      - core_rpc_password
    volumes:
      # /home/dash is the image's declared VOLUME; the datadir is /home/dash/.dashcore.
      - dashd-data:/home/dash
      - ./dashd/dash.conf:/etc/govhub/dash.conf:ro
      - ./dashd/entrypoint.sh:/opt/govhub/dashd-entrypoint.sh:ro
    # Informational only (does not publish): the bridge reaches these by service name.
    expose:
      - "9998"   # JSON-RPC
      - "29998"  # ZMQ PUB
    healthcheck:
      # Passes once RPC is out of warm-up (loading the block index, replaying) -- not when synced.
      test: ["CMD", "dash-cli", "-conf=/tmp/dash.conf", "getblockcount"]
      interval: 30s
      timeout: 20s
      retries: 5
      # A mainnet restart after an unclean stop can replay blocks for a long time.
      start_period: ${DASHD_HEALTH_START_PERIOD:-15m}

  # ---------------------------------------------------------------------------------------------
  # govhub bridge: archives governance objects and signed votes from ZMQ, publishes proposal, tally
  # and cycle documents to your gov contract, serves the read-only HTTP API.
  # Dockerfile: services/bridge/Dockerfile, built from the repository root.
  # ---------------------------------------------------------------------------------------------
  bridge:
    build:
      context: ..
      dockerfile: services/bridge/Dockerfile
    image: govhub-bridge:${BRIDGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      dashd:
        condition: service_healthy
    environment:
      # --- wiring (fixed by this compose file) ---
      CORE_NETWORK: mainnet
      PLATFORM_NETWORK: ${PLATFORM_NETWORK:-mainnet}
      CORE_RPC_URL: http://dashd:9998
      CORE_RPC_USER: ${CORE_RPC_USER:-govhub}
      CORE_RPC_PASSWORD_FILE: /run/secrets/core_rpc_password
      CORE_ZMQ_URL: tcp://dashd:29998
      DB_PATH: /data/bridge.sqlite
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8787"
      BRIDGE_IDENTITY_KEY_FILE: /run/secrets/bridge_identity
      # --- chosen by the operator in .env ---
      # PUBLISH=0 archives and serves the API without writing to Platform: no contract and no
      # identity needed. Start there so the archive begins accumulating history on day one.
      PUBLISH: ${PUBLISH:-0}
      GOV_CONTRACT_ID: ${GOV_CONTRACT_ID:-}
      # --- optional tunables. Empty means "use the bridge's built-in default". ---
      BRIDGE_LOG_LEVEL: ${BRIDGE_LOG_LEVEL:-}
      CORE_RPC_TIMEOUT_MS: ${CORE_RPC_TIMEOUT_MS:-}
      CORE_RPC_RETRIES: ${CORE_RPC_RETRIES:-}
      RECONCILE_INTERVAL_S: ${RECONCILE_INTERVAL_S:-}
      TALLY_PUBLISH_INTERVAL_S: ${TALLY_PUBLISH_INTERVAL_S:-}
      CYCLE_PUBLISH_INTERVAL_S: ${CYCLE_PUBLISH_INTERVAL_S:-}
      MIN_COLLATERAL_CONFS: ${MIN_COLLATERAL_CONFS:-}
      PLATFORM_MAX_CONCURRENT_WRITES: ${PLATFORM_MAX_CONCURRENT_WRITES:-}
      PUBLISH_ON_MISMATCH: ${PUBLISH_ON_MISMATCH:-}
      PORTAL_PROPOSAL_URL: ${PORTAL_PROPOSAL_URL:-}
      # /v1/quorum-proof (services/bridge/README.md): its per-client rate limit takes the client address from cloudflared's (or
      # caddy's) header, in memory only; without it every client shares the proxy's bucket. Set BRIDGE_CLIENT_IP_HEADER=x-forwarded-for
      # behind caddy, and BRIDGE_TRUSTED_PROXY_CIDRS if anything but the proxy can reach the API port.
      CLIENT_IP_HEADER: ${BRIDGE_CLIENT_IP_HEADER:-cf-connecting-ip}
      TRUSTED_PROXY_CIDRS: ${BRIDGE_TRUSTED_PROXY_CIDRS:-}
      QUORUM_PROOF: ${QUORUM_PROOF:-}
      QUORUM_PROOF_MAX_SPAN: ${QUORUM_PROOF_MAX_SPAN:-}
      QUORUM_PROOF_RATE_PER_MIN: ${QUORUM_PROOF_RATE_PER_MIN:-}
      QUORUM_PROOF_RATE_BURST: ${QUORUM_PROOF_RATE_BURST:-}
    secrets:
      - core_rpc_password
      - bridge_identity
    volumes:
      # SQLite archive. This is history Core no longer has: back it up (README, "Backups").
      # The image must create /data owned by its runtime user so the named volume is writable.
      - bridge-data:/data
    # `default` reaches dashd; `edge` is where the public-facing proxies (cloudflared, caddy) live.
    networks:
      - default
      - edge
    ports:
      # Loopback by default. Set BRIDGE_BIND=0.0.0.0 to serve the API directly, or leave it and
      # use the caddy profile for TLS.
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-8787}:8787"

  # ---------------------------------------------------------------------------------------------
  # MN badge issuer (profile `issuer`, docs/PLAN.md §8.4; services/issuer/README.md). Blind-signs one
  # badge token per masternode per epoch for requests signed with the MN's voting key. Reads Core over
  # RPC (protx info) on `default`, is published on `edge` under ITS OWN hostname (never the portal's or
  # the bridge's origin). Holds only the per-epoch private key(s) in secrets/issuer-keys; keys of closed
  # epochs are destroyed by the service. No IPs or per-request records are logged or stored.
  # Dockerfile: services/issuer/Dockerfile, built from the repository root.
  # ---------------------------------------------------------------------------------------------
  issuer:
    build:
      context: ..
      dockerfile: services/issuer/Dockerfile
    image: govhub-issuer:${ISSUER_TAG:-local}
    profiles: ["issuer"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      dashd:
        condition: service_healthy
    environment:
      NETWORK: mainnet
      CORE_RPC_URL: http://dashd:9998
      CORE_RPC_USER: ${CORE_RPC_USER:-govhub}
      CORE_RPC_PASSWORD_FILE: /run/secrets/core_rpc_password
      ISSUER_HMAC_SECRET_FILE: /run/secrets/issuer_hmac_secret
      ISSUER_REPORT_KEY_FILE: /run/secrets/issuer_report_key
      ISSUER_KEY_DIR: /keys
      DB_PATH: /data/issuer.sqlite
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8789"
      ISSUER_IDENTITY_ID: ${ISSUER_IDENTITY_ID:-}
      BADGE_CONTRACT_ID: ${BADGE_CONTRACT_ID:-}
      ISSUER_MAX_STAGED_KEYS: ${ISSUER_MAX_STAGED_KEYS:-1}
      ISSUER_CHALLENGE_TTL_S: ${ISSUER_CHALLENGE_TTL_S:-}
      ISSUER_MAX_TOKEN_RPS: ${ISSUER_MAX_TOKEN_RPS:-}
      ISSUER_LOG_LEVEL: ${ISSUER_LOG_LEVEL:-}
    secrets:
      - core_rpc_password
      - issuer_hmac_secret
      - issuer_report_key
    volumes:
      # Token store: per-MN rows only for the open issuance window (deleted after it), per-epoch counts. Never backed up.
      - issuer-data:/data
      # Private keys, epoch-<E>.pem (0600, uid 1000). Writable: the service destroys keys of closed epochs.
      - ${SECRETS_DIR:-./secrets}/issuer-keys:/keys
    networks:
      - default
      - edge
    ports:
      - "${ISSUER_BIND:-127.0.0.1}:${ISSUER_PORT:-8789}:8789"

  # ---------------------------------------------------------------------------------------------
  # Optional TLS reverse proxy with CORS for the read-only API. Enable with COMPOSE_PROFILES=proxy.
  # Set DOMAIN in .env (default `localhost`, which gets Caddy's internal CA: fine for testing).
  # ---------------------------------------------------------------------------------------------
  caddy:
    image: caddy:${CADDY_TAG:-2-alpine}
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - bridge
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    networks:
      - edge
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data    # certificates: keep, or you will hit ACME rate limits
      - caddy-config:/config

  # ---------------------------------------------------------------------------------------------
  # Cloudflare Tunnel (default way to publish; README section 11). Enable with COMPOSE_PROFILES=tunnel.
  # Outbound-only: no inbound port is opened anywhere. The tunnel is remotely managed, so its public
  # hostnames and ingress live in Cloudflare (scripts/cloudflare-tunnel.sh sets them), e.g.
  #   gov-bridge.<zone>    -> http://bridge:8787
  #   gov-relay.<zone>     -> http://relay:8788        (COMPOSE_PROFILES=tunnel,relay)
  #   gov-issuer.<zone>    -> http://issuer:8789       (COMPOSE_PROFILES=tunnel,issuer; its own origin)
  #   gov-accounts.<zone>  -> http://accounts:<port>   (when accounts lands)
  # The token is a secret file, never an environment value in .env.
  # ---------------------------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2026.10.3}
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *default-logging
    # uid 1000 like dashd and the bridge, so one ownership rule covers every file under secrets/.
    user: "1000:1000"
    depends_on:
      - bridge
    # loglevel fatal: no per-request lines at all (debug logs every request; info, warn and error log each failed origin request
    # with a timestamp). Watch the tunnel on the metrics port or with `cloudflared tunnel info` instead of its log.
    command: ["tunnel", "--loglevel", "fatal", "--metrics", "127.0.0.1:20241", "run"]
    # edge only: cloudflared reaches the bridge, never dashd's RPC or ZMQ, whatever ingress Cloudflare
    # is told to serve.
    networks:
      - edge
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token

  # ---------------------------------------------------------------------------------------------
  # govhub relay (profile `relay`): holds fully signed masternode votes until their release time and
  # broadcasts them with `voteraw`; relays `gobject submit` once a proposal's collateral is confirmed.
  # Holds no keys and no accounts; no IP addresses at rest (services/relay/README.md). Shares this
  # stack's dashd (RPC on the compose network only). Enable with COMPOSE_PROFILES=relay (with `tunnel`
  # to publish it: route `gov-relay.<zone> -> http://relay:8788`).
  # Dockerfile: services/relay/Dockerfile, built from the repository root.
  # ---------------------------------------------------------------------------------------------
  relay:
    profiles: ["relay"]
    build:
      context: ..
      dockerfile: services/relay/Dockerfile
    image: govhub-relay:${RELAY_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      dashd:
        condition: service_healthy
    environment:
      # --- wiring (fixed by this compose file) ---
      CORE_NETWORK: mainnet
      CORE_RPC_URL: http://dashd:9998
      CORE_RPC_USER: ${CORE_RPC_USER:-govhub}
      CORE_RPC_PASSWORD_FILE: /run/secrets/core_rpc_password
      DB_PATH: /data/relay.sqlite
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8788"
      # cloudflared (or caddy) is the only peer: take the client address from its header, in memory only.
      CLIENT_IP_HEADER: ${RELAY_CLIENT_IP_HEADER:-cf-connecting-ip}
      # --- optional tunables. Empty means "use the relay's built-in default" (services/relay/README.md). ---
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-}
      RELEASE_MARGIN_S: ${RELAY_RELEASE_MARGIN_S:-}
      MAX_HOLD_S: ${RELAY_MAX_HOLD_S:-}
      MAX_HELD_PER_MN: ${RELAY_MAX_HELD_PER_MN:-}
      RATE_IP_PER_MIN: ${RELAY_RATE_IP_PER_MIN:-}
      RATE_MN_PER_HOUR: ${RELAY_RATE_MN_PER_HOUR:-}
      PROPOSAL_SUBMIT: ${RELAY_PROPOSAL_SUBMIT:-}
      RETENTION_DAYS: ${RELAY_RETENTION_DAYS:-}
      MAX_PAST_S: ${RELAY_MAX_PAST_S:-}
      MAX_HELD_TOTAL: ${RELAY_MAX_HELD_TOTAL:-}
      TRUSTED_PROXY_CIDRS: ${RELAY_TRUSTED_PROXY_CIDRS:-}
    secrets:
      - core_rpc_password
    volumes:
      # Held votes. Losing it drops votes that were not released yet (clients keep a copy and re-send).
      - relay-data:/data
    networks:
      - default
      - edge
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8790}:8788"

  # ---------------------------------------------------------------------------------------------
  # SLOTS for services that are not built yet. Keep the pattern when they land:
  #   * one service per component, built from ../services/<name>/Dockerfile with context `..`
  #   * configuration only through env vars and docker secrets (never baked into the image)
  #   * state on a named volume; HTTP published on loopback by default; HEALTHCHECK in the image
  #   * if it must be reachable from a browser, add a path (or a host) to caddy/Caddyfile
  #
  # accounts:  central-login envelopes (encrypted blobs only).
  # ---------------------------------------------------------------------------------------------

secrets:
  # Plain files, created by scripts/init.sh in ./secrets (git-ignored, mode 0700 dir).
  core_rpc_password:
    file: ${SECRETS_DIR:-./secrets}/core_rpc_password
  # JSON: {"identityId": "...", "keyId": N, "privateKeyHex": "..."} (or "wif"). The bridge reads
  # it only when PUBLISH=1. init.sh creates an empty placeholder so archive-only mode can start.
  bridge_identity:
    file: ${SECRETS_DIR:-./secrets}/bridge_identity.json
  # Cloudflare Tunnel token, written by scripts/cloudflare-tunnel.sh. Used only by profile `tunnel`;
  # init.sh creates an empty placeholder.
  cloudflare_tunnel_token:
    file: ${SECRETS_DIR:-./secrets}/cloudflare_tunnel_token
  # Issuer (profile `issuer`): 32+ random bytes as hex for the stateless challenges (init.sh creates it),
  # and the issuer identity's HIGH key as JSON {"identityId","keyId","privateKeyHex"} for issuerReport
  # documents (init.sh creates an EMPTY placeholder; `issuer run` refuses to start until it is filled: readers flag an issuer
  # without reports). The CRITICAL key never goes on the server.
  issuer_hmac_secret:
    file: ${SECRETS_DIR:-./secrets}/issuer_hmac_secret
  issuer_report_key:
    file: ${SECRETS_DIR:-./secrets}/issuer_report_key.json

volumes:
  dashd-data:
  bridge-data:
  relay-data:
  issuer-data:
  caddy-data:
  caddy-config:

networks:
  default:
    # A fixed subnet so dashd's rpcallowip can name it. Change GOVHUB_SUBNET if it overlaps a
    # network you already use.
    ipam:
      config:
        - subnet: ${GOVHUB_SUBNET:-172.29.73.0/24}
  # Public-facing side: bridge + cloudflared/caddy. Docker picks the subnet; it is outside
  # GOVHUB_SUBNET, so dashd's rpcallowip does not cover it and dashd is not attached to it.
  edge: {}
