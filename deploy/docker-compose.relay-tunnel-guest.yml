# Publish THIS stack's relay through ANOTHER stack's cloudflared on the same host, next to its bridge (README sections 11.3,
# 11.4), e.g. the testnet relay through the mainnet tunnel. Layer it after docker-compose.tunnel-guest.yml, with the relay profile:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.testnet.yml:docker-compose.tunnel-guest.yml:docker-compose.relay-tunnel-guest.yml
#   COMPOSE_PROFILES=relay
#
# The relay does NOT join the shared `tunnel` network (only the gateway may: a guest service there could shadow the host
# stack's routes). Instead the gateway gets a second listener, 8788 -> relay:8788 over the guest's `edge` network, and a second
# alias on `tunnel` (RELAY_TUNNEL_ALIAS, default `<project>-relay`, e.g. `govhub-testnet-relay`).
# Tunnel route: `gov-relay-testnet.<zone> -> http://govhub-testnet-relay:8788`. dashd stays on `default` only.
services:
  tunnel-gateway:
    depends_on:
      - bridge
      - relay
    command: ["caddy", "run", "--adapter", "caddyfile", "--config", "/etc/caddy/Caddyfile"]
    volumes:
      - ./caddy/tunnel-gateway-relay.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge: {}
      tunnel:
        aliases:
          - ${TUNNEL_ALIAS:-${COMPOSE_PROJECT_NAME:-govhub}-bridge}
          - ${RELAY_TUNNEL_ALIAS:-${COMPOSE_PROJECT_NAME:-govhub}-relay}
