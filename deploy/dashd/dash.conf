# govhub dashd base configuration (mounted read-only at /etc/govhub/dash.conf).
#
# dashd-entrypoint.sh copies this file to /tmp/dash.conf inside the container and appends the
# values that come from the environment or from secrets: the network selector, RPC credentials,
# rpcallowip, dbcache, the P2P port. Edit this file only for settings that are the same on every
# network. Everything else is controlled from .env (see .env.example).

# ---- what the bridge needs from Core ---------------------------------------------------------
server=1

# Governance must be enabled. Core refuses to start with governance on and txindex off (outside
# regtest), and the bridge needs getrawtransaction to verify proposal collateral.
disablegovernance=0
txindex=1

# ZMQ: raw governance objects and raw signed votes are the reason this node exists. Core discards
# expired proposals and superseded votes; ZMQ is how the bridge archives them first.
# All topics share ONE endpoint, which is what the bridge's single CORE_ZMQ_URL expects.
# This port is reachable only on the compose network. ZMQ has no authentication: never publish it.
zmqpubrawgovernanceobject=tcp://0.0.0.0:29998
zmqpubrawgovernancevote=tcp://0.0.0.0:29998
zmqpubhashblock=tcp://0.0.0.0:29998
zmqpubhashchainlock=tcp://0.0.0.0:29998
# Core's default high-water mark is 1000 messages. A governance resync (see README) replays every
# live vote in a burst of tens of thousands; ZMQ drops anything over the mark silently.
# Topics that share an endpoint share ONE socket, and Core sets the mark from whichever topic binds
# it first (src/zmq/zmqpublishnotifier.cpp, CZMQAbstractPublishNotifier::Initialize; topics are
# initialized in name order, so pubhashblock goes first). Set the SAME mark on every topic, or the
# governance mark is ignored.
zmqpubrawgovernanceobjecthwm=200000
zmqpubrawgovernancevotehwm=200000
zmqpubhashblockhwm=200000
zmqpubhashchainlockhwm=200000

# ---- RPC: compose network only ---------------------------------------------------------------
# The entrypoint adds rpcport=9998 (the same internal port on every network, so the bridge URL
# never changes), rpcbind=0.0.0.0 and rpcallowip=$RPC_ALLOW_CIDR in the network's own
# [main]/[test]/[regtest] section, because Core ignores those options at top level off mainnet.
# The port is never published to the host.
rpcworkqueue=64
rpcthreads=8

# ---- misc -------------------------------------------------------------------------------------
printtoconsole=1
logtimestamps=1
# The bridge reconciles with `gobject list` and `gobject getcurrentvotes`, which can run for a
# while on mainnet.
rpcservertimeout=120
